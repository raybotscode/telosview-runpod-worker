name: Build RunPod Worker Image

on:
  push:
    paths:
      - 'processing/runpod-worker/**'
      - 'processing/worker.html'
      - 'splat-test/src/**'
      - '.github/workflows/runpod-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Assemble build context
        run: |
          mkdir -p build-ctx/src
          cp processing/runpod-worker/Dockerfile build-ctx/
          cp processing/runpod-worker/package.json build-ctx/
          cp processing/runpod-worker/server.mjs build-ctx/
          cp processing/worker.html build-ctx/
          cp -r splat-test/src/* build-ctx/src/
          echo "Build context files:"
          find build-ctx -type f | sort

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build-ctx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        run: |
          # Wait for package to be registered
          sleep 10
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${{ env.IMAGE_NAME }}/visibility" \
            -f visibility='public' || echo "Could not set visibility (may need manual setting)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
