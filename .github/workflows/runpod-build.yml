name: Build RunPod Worker Image

on:
  push:
    paths:
      - 'processing/runpod-worker/**'
      - 'processing/worker.html'
      - 'splat-test/src/**'
      - '.github/workflows/runpod-build.yml'
  workflow_dispatch:

env:
  DOCKER_IMAGE: raybotsemail/telosview-worker

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Assemble build context
        run: |
          mkdir -p build-ctx/src
          cp processing/runpod-worker/Dockerfile build-ctx/
          cp processing/runpod-worker/package.json build-ctx/
          cp processing/runpod-worker/server.mjs build-ctx/
          cp processing/worker.html build-ctx/
          cp -r splat-test/src/* build-ctx/src/
          echo "Build context files:"
          find build-ctx -type f | sort

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build-ctx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
