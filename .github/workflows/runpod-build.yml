name: Build RunPod Worker Image

on:
  push:
    paths:
      - 'processing/runpod-worker/**'
      - 'processing/worker.html'
      - 'splat-test/src/**'
      - '.github/workflows/runpod-build.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/telosview-runpod-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble build context
        run: |
          mkdir -p build-ctx/src
          cp processing/runpod-worker/Dockerfile build-ctx/
          cp processing/runpod-worker/package.json build-ctx/
          cp processing/runpod-worker/server.mjs build-ctx/
          cp processing/worker.html build-ctx/
          cp -r splat-test/src/* build-ctx/src/
          echo "Build context:"
          find build-ctx -type f | head -20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build-ctx
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
